# Spring Boot Application Configuration - Production Profile
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/daamdb
spring.datasource.username=daam_user
spring.datasource.password=daam_password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.error.include-stacktrace=never
server.error.include-message=always
server.compression.enabled=true
server.compression.min-response-size=1024

# Logging Configuration
logging.level.root=INFO
logging.level.com.daam=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=WARN
logging.file.name=./logs/application.log
logging.file.max-size=10MB
logging.file.max-history=14
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
app.jwt.secret=mySecretKeyForDevelopmentTestingWithMoreLength1234567890
app.jwt.expiration=86400000

# Security
spring.security.require-https=false
spring.security.user.name=admin
spring.security.user.password=changeme

# Application Properties
app.name=DAAM Application
app.version=1.0.0
app.description=Dinner and a Movie Application

# Actuator (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true

# Jackson Configuration
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# HTTP Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Tomcat Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
