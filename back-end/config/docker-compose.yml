version: '3.8'

services:
  mysql:
    image: mysql:8.4-lts
    container_name: daamdb
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret123}
      MYSQL_DATABASE: ${DB_NAME:-daamdb}
      MYSQL_USER: ${DB_USER:-daam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
    volumes:
      - ./database/daamdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - daam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - daam_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  daam_mysql_data:
    driver: local

networks:
  daam_network:
    driver: bridge
